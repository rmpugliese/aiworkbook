[project]
name = "app"
version = "0.1.0"
description = "AI Project Workbook API"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi[standard]>=0.142.2",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.1.3",
    "weasyprint>=70.0",
]

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pypdf>=6.19.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# Alembic's revision template leaves trailing whitespace in the docstring header.
"migrations/versions/*" = ["W291"]

[[tool.mypy.overrides]]
# WeasyPrint ships no type information.
module = ["weasyprint", "weasyprint.*"]
ignore_missing_imports = true
