# Production behind an existing Nginx Proxy Manager (instead of Caddy): the app, PostgreSQL,
# a nightly backup and the daily clean-up. Nothing is published on the host: Nginx Proxy Manager
# reaches the app by its container name on its own Docker network.
#
# Usage (see DEPLOY.md, "Server con Nginx Proxy Manager"):
#   docker compose -f docker-compose.npm.yml up -d --build
# NPM_NETWORK is the Nginx Proxy Manager network (`docker network ls`), docker_default by default.
name: aiworkbook

services:
  app:
    build:
      context: ..
    image: aiworkbook:latest
    container_name: aiworkbook-app
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://workbook:${POSTGRES_PASSWORD}@db:5432/workbook
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - internal
      - proxy

  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: workbook
      POSTGRES_USER: workbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workbook -d workbook"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Only on the internal network: the proxy never sees the database.
    networks:
      - internal

  backup:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: workbook
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: workbook
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backup.sh:/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - internal

  cleanup:
    image: aiworkbook:latest
    restart: unless-stopped
    env_file: .env
    environment:
      APP_DATABASE_URL: postgresql+psycopg://workbook:${POSTGRES_PASSWORD}@db:5432/workbook
    entrypoint: ["sh", "-c", "while true; do python -m app.cli cleanup; sleep 86400; done"]
    depends_on:
      - app
    networks:
      - internal

networks:
  internal:
  proxy:
    external: true
    name: ${NPM_NETWORK:-docker_default}

volumes:
  db-data:
